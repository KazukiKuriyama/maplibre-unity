name: Release

# Tag push triggers regression tests and deploys the latest WebGL sample
# build to GitHub Pages. workflow_dispatch lets a maintainer redeploy the
# current state of any branch on demand (e.g. to preview a fix before
# tagging). There is no GitHub Release object created and no Player binary
# / UPM tarball uploaded -- the package is consumed via UPM git URL
# (`?path=...#vX.Y.Z`), and the live demo lives on Pages.
on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: read
  checks: write
  pull-requests: write
  pages: write
  id-token: write

# Pages deployments are inherently serial -- do not interrupt an in-flight
# deploy with a newer tag, queue it instead so the latest tag wins.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    uses: ./.github/workflows/test.yml
    secrets: inherit

  build-webgl:
    needs: test
    name: Build WebGL
    runs-on: ubuntu-latest
    env:
      # game-ci/unity-builder@v4.6.0 still ships with Node 20; opt the runner
      # into Node 24 so the action survives the 2026-06-02 default switch.
      # Mirrors test.yml -- drop once unity-builder ships v5+.
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    steps:
      - name: Free disk space
        run: |
          echo "=== Before ==="
          df -h /
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/graalvm
          sudo rm -rf /usr/local/.ghcup
          sudo docker system prune -af || true
          echo "=== After ==="
          df -h /

      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          lfs: true

      - name: Verify package.json version matches tag
        # Guardrail: tag and package.json must agree before we deploy. Stops
        # accidental drift where someone tags v0.4.0 but forgot to bump the
        # manifest, which would mislead UPM consumers pinning to that tag.
        # Skipped on workflow_dispatch since there is no tag to verify
        # against (the dispatch deploys whatever the selected ref points at).
        if: github.event_name == 'push'
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION=$(jq -r .version Packages/com.kazukikuriyama.maplibre-unity/package.json)
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match Packages/com.kazukikuriyama.maplibre-unity/package.json version ${PKG_VERSION}"
            exit 1
          fi
          echo "Version match: ${TAG_VERSION}"

      - name: Cache Library
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: Library
          key: Library-Build-WebGL-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-Build-WebGL-
            Library-

      - name: Inject release version into PlayerSettings.bundleVersion
        # Repository keeps a placeholder bundleVersion (0.0.0-dev) so dev/Editor
        # builds don't pretend to be a real release. On tag push we overwrite
        # it with the tag version so the Player binary's Application.version
        # matches the deployed tag. On workflow_dispatch (ad-hoc deploy from
        # a branch) we use a dev marker derived from the commit SHA so the
        # deployed app is clearly identifiable as not-a-real-release. Cache
        # key above is computed before this step runs, so the placeholder
        # hash keeps cache hits working across releases.
        run: |
          if [ "${GITHUB_EVENT_NAME}" = "push" ]; then
            VERSION="${GITHUB_REF_NAME#v}"
          else
            VERSION="dev-${GITHUB_SHA:0:7}"
          fi
          sed -i.bak "s/^  bundleVersion: .*/  bundleVersion: ${VERSION}/" ProjectSettings/ProjectSettings.asset
          rm ProjectSettings/ProjectSettings.asset.bak
          grep '^  bundleVersion:' ProjectSettings/ProjectSettings.asset

      - name: Build WebGL
        # TODO: pin to a SHA once the desired unity-builder version is verified,
        # to match the SHA-pinning convention used by test.yml.
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          unityVersion: 6000.3.10f1
          targetPlatform: WebGL
          buildName: maplibre-unity
          versioning: None

      - name: Upload Pages artifact
        # actions/upload-pages-artifact bundles the directory into a tar that
        # actions/deploy-pages knows how to consume. Use the directory Unity
        # writes to (build/WebGL) directly -- it already contains index.html
        # at the root.
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v4.0.0
        with:
          path: build/WebGL

  deploy-pages:
    needs: build-webgl
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
